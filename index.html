<body>
  <!-- Site-wide background photo. To swap it, replace assets/hero.jpg / hero.webp / hero-1200.jpg / hero-1200.webp (same file names). -->
  <div class="site-bg" aria-hidden="true">
    <picture>
      <source type="image/webp" srcset="assets/hero-1200.webp 1200w, assets/hero.webp 2400w" sizes="100vw">

  <header class="site-header" id="header">

        <picture>
          <source type="image/webp" srcset="assets/hero-1200.webp 1200w, assets/hero.webp 2400w" sizes="100vw">

      <span class="xh xh-tl" aria-hidden="true"></span><span class="xh xh-tr" aria-hidden="true"></span>
      <div class="hero-copy">

        <p class="label hero-byline" data-t="hero.byline"></p>

      </div>
      <div class="stripe" aria-hidden="true"></div>
    </section>

    <section class="section" id="project" aria-labelledby="h-project">

        <header class="sec-head"><span class="label">01 / <span id="h-project" data-t="ui.sections.project"></span></span></header>
        <p class="statement" data-t="project"></p>
      </div>

    <section class="section section-alt contours" id="goals" aria-labelledby="h-goals">

        <header class="sec-head"><span class="label">02 / <span id="h-goals" data-t="ui.sections.goals"></span></span></header>

      </div>

    <section class="section" id="team" aria-labelledby="h-team">
      <div class="wrap">
        <header class="sec-head"><span class="label">03 / <span id="h-team" data-t="ui.sections.team"></span></span></header>
        <div class="supervisor" id="supervisor"></div>
        <ul class="jury" id="jury"></ul>
        <ul class="people" id="people"></ul>
      </div>
    </section>

    <section class="section section-alt" id="reports" aria-labelledby="h-reports">

        <header class="sec-head"><span class="label">04 / <span id="h-reports" data-t="ui.sections.reports"></span></span></header>
